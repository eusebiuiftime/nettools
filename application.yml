server:
  port: 8080

spring:
  application:
    name: NetTools

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
    database-change-log-table: z_databasechangelog
    database-change-log-lock-table: z_databasechangeloglock

  mail:
    host: smtp.zoho.eu
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    dev.eusebiu.nettools: DEBUG


nettools:
  mail:
    from: ${MAIL_FROM}

  wol:
    mac-address: ${WOL_MAC_ADDRESS}
    broadcast-address: ${WOL_BROADCAST_ADDRESS}
