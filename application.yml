server:
  port: 8080

spring:
  application:
    name: NetTools

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
    database-change-log-table: z_databasechangelog
    database-change-log-lock-table: z_databasechangeloglock

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    dev.eusebiu.nettools: DEBUG