databaseChangeLog:
  - changeSet:
      id: 002-create-modem-traffic
      author: eusebiu

      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: modem
        - not:
            - tableExists:
                tableName: modem_traffic

      changes:
        - sql:
            sql: |
              CREATE TABLE modem_traffic (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  modem_id_fk BIGINT NOT NULL,
                  recorded_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  monthly_rx_bytes BIGINT,
                  monthly_tx_bytes BIGINT,
                  traffic_period VARCHAR(8),

                  CONSTRAINT fk_modem_traffic_modem
                      FOREIGN KEY (modem_id_fk)
                      REFERENCES modem(id),

                  CONSTRAINT chk_monthly_rx_bytes
                      CHECK (monthly_rx_bytes >= 0),

                  CONSTRAINT chk_monthly_tx_bytes
                      CHECK (monthly_tx_bytes >= 0)
              );

              CREATE INDEX idx_modem_traffic_date
                  ON modem_traffic (modem_id_fk, recorded_at DESC);

      rollback:
        - sql:
            sql: |
              DROP TABLE modem_traffic;
