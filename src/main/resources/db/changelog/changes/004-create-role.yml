databaseChangeLog:
  - changeSet:
      id: 004-create-role
      author: eusebiu

      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                tableName: role

      changes:
        - sql:
            sql: |
              CREATE TABLE role(
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  name VARCHAR(50) NOT NULL UNIQUE
              );
              
              INSER INTO role(name)
              VALUES 
                ('ROLE_USER'),
                (ROLE_ADMIN);
              

      rollback:
        - sql:
            sql: | 
              DROP table role;

