databaseChangeLog:
  - changeSet:
      id: 006-create-email-verification-token
      author: eusebiu

      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: user
        - not:
            - tableExists:
                tableName: email_verification_token

      changes:
        - sql:
            sql: |
              CREATE TABLE email_verification_token (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  user_id_fk BIGINT NOT NULL,
                  token_hash VARCHAR(64) NOT NULL UNIQUE,
                  expires_at TIMESTAMPTZ NOT NULL,
                  used_at TIMESTAMPTZ,
                  failed_attempts INTEGER NOT NULL DEFAULT 0,

                  CONSTRAINT fk_email_verification_token_user
                      FOREIGN KEY (user_id_fk)
                      REFERENCES "user"(id),
                  CONSTRAINT chk_email_verification_failed_attempts
                      CHECK (failed_attempts >= 0)
              );

              CREATE INDEX idx_email_verification_token_user
                  ON email_verification_token(user_id_fk);

      rollback:
        - sql:
            sql: |
              DROP TABLE email_verification_token;
