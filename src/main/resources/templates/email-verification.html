<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NetTools - Email verification</title>
</head>
<body bgcolor="#f3f4f6" style="margin:0; padding:0; background-color:#f3f4f6;
             font-family:Arial,Helvetica,sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       bgcolor="#f3f4f6" style="background-color:#f3f4f6; padding:32px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   bgcolor="#ffffff" style="max-width:520px; background-color:#ffffff;
                          border:1px solid #d1d5db; border-radius:16px;">

                <tr>
                    <td style="padding:28px 24px 20px;
                               border-bottom:1px solid #e5e7eb;">
                        <span style="font-size:24px; font-weight:bold;
                                     color:#111827;">
                            Net<span style="color:#1d4ed8;">Tools</span>
                        </span>
                    </td>
                </tr>

                <tr>
                    <td style="padding:28px 24px;">
                        <h1 style="color:#111827; font-size:25px;
                                   margin:0 0 16px;">
                            Verify your email address
                        </h1>

                        <p style="color:#374151; font-size:15px;
                                  line-height:1.7; margin:0 0 28px;">
                            Welcome to NetTools! Use the following
                            code to complete your registration.
                        </p>

                        <table role="presentation" width="100%"
                               cellpadding="0" cellspacing="0"
                               bgcolor="#eff6ff" style="background-color:#eff6ff;
                                      border:1px solid #bfdbfe;
                                      border-radius:12px;">
                            <tr>
                                <td align="center" style="padding:28px 12px;">
                                    <p style="color:#4b5563; font-size:12px;
                                              margin:0 0 16px;">
                                        VERIFICATION CODE
                                    </p>

                                    <div style="color:#111827; font-family:Arial,Helvetica,sans-serif; font-size:32px;
                                                font-weight:bold;
                                                letter-spacing:4px; white-space:nowrap;">
                                        {{CODE}}
                                    </div>

                                    <p style="color:#1d4ed8; font-size:13px;
                                              margin:16px 0 0;">
                                        Valid for {{minutes}} minutes
                                    </p>
                                </td>
                            </tr>
                        </table>

                        <p style="color:#4b5563; font-size:13px;
                                  line-height:1.6; margin:28px 0 0;">
                            If you did not request this registration,
                            you can ignore this email.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center"
                        style="padding:24px; border-top:1px solid #e5e7eb;
                               color:#4b5563; font-size:12px;">
                        NetTools &middot; Automated Security Notification
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
