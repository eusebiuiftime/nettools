<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NetTools - Verifica email</title>
</head>
<body style="margin:0; padding:0; background-color:#090d16;
             font-family:Arial,Helvetica,sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background-color:#090d16; padding:40px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:520px; background-color:#151b28;
                          border:1px solid #2a3445; border-radius:16px;">

                <tr>
                    <td style="padding:32px 36px 24px;
                               border-bottom:1px solid #30394b;">
                        <span style="font-size:24px; font-weight:bold;
                                     color:#ffffff;">
                            Net<span style="color:#60a5fa;">Tools</span>
                        </span>
                    </td>
                </tr>

                <tr>
                    <td style="padding:36px;">
                        <h1 style="color:#ffffff; font-size:25px;
                                   margin:0 0 16px;">
                            Verifica la tua email
                        </h1>

                        <p style="color:#aab5c5; font-size:15px;
                                  line-height:1.7; margin:0 0 28px;">
                            Benvenuto su NetTools! Utilizza il codice
                            seguente per completare la registrazione.
                        </p>

                        <table role="presentation" width="100%"
                               cellpadding="0" cellspacing="0"
                               style="background-color:#0d1320;
                                      border:1px solid #31415b;
                                      border-radius:12px;">
                            <tr>
                                <td align="center" style="padding:28px 12px;">
                                    <p style="color:#8e9db3; font-size:12px;
                                              margin:0 0 16px;">
                                        CODICE DI VERIFICA
                                    </p>

                                    <div style="color:#ffffff; font-size:36px;
                                                font-weight:bold;
                                                letter-spacing:5px;">
                                        {{CODE}}
                                    </div>

                                    <p style="color:#60a5fa; font-size:13px;
                                              margin:16px 0 0;">
                                        Valido per {{minutes}} minuti
                                    </p>
                                </td>
                            </tr>
                        </table>

                        <p style="color:#8e9db3; font-size:13px;
                                  line-height:1.6; margin:28px 0 0;">
                            Se non hai richiesto questa registrazione,
                            puoi ignorare questa email.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center"
                        style="padding:24px; border-top:1px solid #30394b;
                               color:#6f7d92; font-size:12px;">
                        NetTools &middot; Automated Security Notification
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
